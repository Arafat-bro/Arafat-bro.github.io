media:
  - name: images
    label: Images
    input: assets/uploads
    output: /assets/uploads
    extensions: [jpg, jpeg, png, webp, gif]

  - name: documents
    label: Documents
    input: assets/docs
    output: /assets/docs
    extensions: [pdf]

content:
  - name: profile
    label: Personal Profile
    type: file
    path: content/profile.json
    format: json
    fields:
      - { name: display_name, label: Display Name, type: string, required: true }
      - { name: headline, label: Academic Headline, type: text }
      - { name: location, label: Location, type: string }
      - { name: bio, label: Biography, type: rich-text }
      - { name: profile_image, label: Profile Photograph, type: image }
      - { name: linkedin, label: LinkedIn, type: string }
      - { name: researchgate, label: ResearchGate, type: string }
      - { name: orcid, label: ORCID, type: string }
      - { name: cv_file, label: Current CV, type: file }

  - name: experience
    label: Research and Employment
    type: file
    path: content/experience.json
    format: json
    list: true
    fields:
      - { name: position, type: string, required: true }
      - { name: organization, type: string }
      - { name: department, type: string }
      - { name: start_date, type: string }
      - { name: end_date, type: string }
      - { name: description, type: text }

  - name: education
    label: Education
    type: file
    path: content/education.json
    format: json
    list: true
    fields:
      - { name: degree, type: string, required: true }
      - { name: institution, type: string }
      - { name: department, type: string }
      - { name: start_date, type: string }
      - { name: end_date, type: string }
      - { name: status, type: string }
      - { name: grade, type: string }
      - { name: description, type: text }

  - name: skills
    label: Skills
    type: file
    path: content/skills.json
    format: json
    list: true
    fields:
      - { name: category, type: string, required: true }
      - name: items
        type: string
        list: true

  - name: publications
    label: Publications
    type: file
    path: content/publications.json
    format: json
    list: true
    fields:
      - { name: title, type: string, required: true }
      - { name: authors, type: text }
      - { name: journal, type: string }
      - { name: year, type: number }
      - { name: doi, type: string }
      - { name: url, type: string }
      - { name: status, type: string }
      - { name: description, type: text }

  - name: interests
    label: Research Interests
    type: file
    path: content/interests.json
    format: json
    fields:
      - name: paragraphs
        type: text
        list: true

  - name: awards
    label: Awards and Certifications
    type: file
    path: content/awards.json
    format: json
    list: true
    fields:
      - { name: title, type: string, required: true }
      - { name: issuer, type: string }
      - { name: date, type: string }
      - { name: description, type: text }

  - name: hobbies
    label: Hobbies
    type: file
    path: content/hobbies.json
    format: json
    fields:
      - name: paragraphs
        type: text
        list: true

  - name: extra
    label: Extracurricular Activities
    type: file
    path: content/extra.json
    format: json
    list: true
    fields:
      - { name: title, type: string, required: true }
      - { name: period, type: string }
      - { name: image, type: image }

  - name: projects
    label: Research Projects
    type: file
    path: content/projects.json
    format: json
    list: true
    fields:
      - { name: title, type: string, required: true }
      - { name: role, type: string }
      - { name: period, type: string }
      - { name: status, type: string }
      - { name: summary, type: rich-text }
      - { name: methods, type: text }

  - name: carousel
    label: Portfolio Carousel
    type: file
    path: content/carousel.json
    format: json
    list: true
    fields:
      - { name: title, type: string, required: true }
      - { name: caption, type: text }
      - { name: image, type: image }

  - name: gallery
    label: Portfolio Gallery
    type: file
    path: content/gallery.json
    format: json
    list: true
    fields:
      - { name: title, type: string, required: true }
      - { name: image, type: image }
      - { name: caption, type: text }

settings:
  content:
    merge: true
  commit:
    identity: app
    templates:
      create: "content: add {path}"
      update: "content: update {path}"
      delete: "content: delete {path}"
      rename: "content: rename {oldPath}"
